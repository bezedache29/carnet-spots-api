server {
    listen 80;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 60;
        include fastcgi_params;
    }

    # Map tiles: only reachable through an X-Accel-Redirect from TileController, after Laravel has
    # checked the token. Nginx then sends the file itself, Range requests (resumed downloads) included.
    # ^~: no regex location added later can take precedence over this one.
    location ^~ /_protected-tiles/ {
        internal;
        alias /var/www/html/storage/app/private/tiles/;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
