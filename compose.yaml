services:
    laravel.test:
        build:
            context: './vendor/laravel/sail/runtimes/8.5'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
        image: 'sail-8.5/app'
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
            - '/mnt/e/DEV/infrastructure/traefik/certs:/etc/traefik/certs:ro'
        networks:
            - sail
            - traefik-network
        depends_on:
            - mysql
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.carnet-spots-api.rule=Host(`${APP_DOMAIN}`)'
            - 'traefik.http.routers.carnet-spots-api.entrypoints=websecure'
            - 'traefik.http.routers.carnet-spots-api.tls=true'
            - 'traefik.http.services.carnet-spots-api.loadbalancer.server.port=80'
            - 'traefik.docker.network=traefik-network'
    mysql:
        image: 'mysql:8.4'
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'carnet-spots-api-mysql:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 3
            timeout: 5s
    phpmyadmin:
        image: 'phpmyadmin:latest'
        environment:
            PMA_HOST: mysql
            PMA_USER: '${DB_USERNAME}'
            PMA_PASSWORD: '${DB_PASSWORD}'
        networks:
            - sail
            - traefik-network
        depends_on:
            - mysql
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.carnet-spots-api-pma.rule=Host(`pma-carnet-spots-api.dev.localhost`)'
            - 'traefik.http.routers.carnet-spots-api-pma.entrypoints=websecure'
            - 'traefik.http.routers.carnet-spots-api-pma.tls=true'
            - 'traefik.http.services.carnet-spots-api-pma.loadbalancer.server.port=80'
            - 'traefik.docker.network=traefik-network'
networks:
    sail:
        driver: bridge
    traefik-network:
        external: true
volumes:
    carnet-spots-api-mysql:
        driver: local
